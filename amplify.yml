version: 1
frontend:
  phases:
    preBuild:
      commands:
        - ls -la
        - npm ci --prefix v2
    build:
      commands:
        - ls -la
        - npm run build --prefix v2
  artifacts:
    baseDirectory: v2/dist
    files:
      - '**/*'
  cache:
    paths:
      - v2/node_modules/**/*
  customRules:
    # /privacy must resolve to the real page, not the SPA shell.
    #
    # ⚠️ Order matters: this has to come BEFORE the catch-all below, which
    # otherwise swallows it -- the catch-all matches any path with no dot, and
    # "/privacy" has no dot. That is exactly why /privacy and /terms both 301'd
    # to the app shell before this existed.
    #
    # The page is required for SMS: carriers will not approve a sending number
    # without a reachable privacy policy stating what is sent and how to opt out.
    - source: '/privacy'
      target: /privacy.html
      status: '200'
    # `html` added to the passthrough list so privacy.html serves itself instead
    # of being rewritten to index.html like every other extension-less path.
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|png|txt|svg|woff|woff2|ttf|map|json|webp|html)$)([^.]+$)/>'
      target: /index.html
      status: '200'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: X-Frame-Options
          value: DENY
        - key: X-Content-Type-Options
          value: nosniff
        - key: Referrer-Policy
          value: strict-origin-when-cross-origin
    - pattern: '/assets/**'
      headers:
        - key: Cache-Control
          value: public, max-age=31536000, immutable
